name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m py_compile bridge/bridge.py bridge/test_bridge.py
      - name: Plist sanity check
        run: python -c "import plistlib; plistlib.load(open('bridge/com.muse.t3bridge.plist','rb'))"
      - name: Bridge smoke test
        run: python bridge/test_bridge.py
