    .s { font-size: 15px; }
    .p { font-size: 14px; }
    .chip-label { font-size: 13.5px; }
    .edge path { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .edge text { font-size: 15px; }
    .dashed path { stroke-dasharray: 7 6; }

    .card { fill: #f6f8fa; }
    .mac rect { fill: #ffffff; stroke: #8c959f; stroke-width: 1.5; }
    .mac text { fill: #24292f; }

    .ext .shape { fill: #fbefff; stroke: #8250df; stroke-width: 2; }
    .ext text { fill: #512a97; }

    .box .shape { fill: #fff8c5; stroke: #bf8700; stroke-width: 2; }
    .box text { fill: #6c4400; }
    .box .chip { fill: #ffffff; stroke: #d4a72c; stroke-width: 1; }

    .group-muse rect { fill: #eef6ff; stroke: #80ccff; stroke-width: 1.5; }
    .group-muse text { fill: #0a3069; }
    .muse .shape { fill: #ffffff; stroke: #0969da; stroke-width: 2; }
    .muse text { fill: #0a3069; }

    .group-t3 rect { fill: #edf9f0; stroke: #6fdd8b; stroke-width: 1.5; }
    .group-t3 text { fill: #044f1e; }
    .t3 .shape { fill: #ffffff; stroke: #1a7f37; stroke-width: 2; }
    .t3 .lid { fill: #d3f5dc; stroke: #1a7f37; stroke-width: 2; }
    .t3 text { fill: #044f1e; }

    .old .shape { fill: #f6f8fa; stroke: #6e7781; stroke-width: 2; stroke-dasharray: 7 6; }
    .old text { fill: #424a53; }

    .from-ext path { stroke: #8250df; }
    .from-ext text { fill: #6639ba; }
    .from-box path { stroke: #bf8700; }
    .from-box text { fill: #7d4e00; }
    .from-muse path { stroke: #0969da; }
    .from-muse text { fill: #0550ae; }
    .from-t3 path { stroke: #1a7f37; }
    .from-t3 text { fill: #116329; }
    .from-old path { stroke: #6e7781; }
    .from-old text { fill: #57606a; }
    .head-ext { fill: #8250df; }
    .head-box { fill: #bf8700; }
    .head-muse { fill: #0969da; }
    .head-t3 { fill: #1a7f37; }
    .head-old { fill: #6e7781; }

    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; }
      .mac rect { fill: #161b22; stroke: #6e7681; }
      .mac text { fill: #f0f6fc; }

      .ext .shape { fill: #271052; stroke: #a371f7; }
      .ext text { fill: #e2c5ff; }

      .box .shape { fill: #341a00; stroke: #d29922; }
      .box text { fill: #f8e3a1; }
      .box .chip { fill: #4b2900; stroke: #bb8009; }

      .group-muse rect { fill: #0b1f3f; stroke: #1f6feb; }
      .group-muse text { fill: #cae8ff; }
      .muse .shape { fill: #0c2d6b; stroke: #58a6ff; }
      .muse text { fill: #cae8ff; }

      .group-t3 rect { fill: #0a2616; stroke: #238636; }
      .group-t3 text { fill: #aff5b4; }
      .t3 .shape { fill: #033a16; stroke: #3fb950; }
      .t3 .lid { fill: #0f5323; stroke: #3fb950; }
      .t3 text { fill: #aff5b4; }

      .old .shape { fill: #21262d; stroke: #8b949e; }
      .old text { fill: #c9d1d9; }

      .from-ext path { stroke: #a371f7; }
      .from-ext text { fill: #d2a8ff; }
      .from-box path { stroke: #d29922; }
      .from-box text { fill: #e3b341; }
      .from-muse path { stroke: #58a6ff; }
      .from-muse text { fill: #a5d6ff; }
      .from-t3 path { stroke: #3fb950; }
      .from-t3 text { fill: #7ee787; }
      .from-old path { stroke: #8b949e; }
      .from-old text { fill: #b1bac4; }
      .head-ext { fill: #a371f7; }
      .head-box { fill: #d29922; }
      .head-muse { fill: #58a6ff; }
      .head-t3 { fill: #3fb950; }
      .head-old { fill: #8b949e; }
    }
  </style>

  <defs>
    <marker id="arrow-ext" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto"><path class="head-ext" d="M0 0 L13 5.5 L0 11 L3 5.5 z"/></marker>
    <marker id="arrow-box" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto"><path class="head-box" d="M0 0 L13 5.5 L0 11 L3 5.5 z"/></marker>
    <marker id="arrow-muse" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto"><path class="head-muse" d="M0 0 L13 5.5 L0 11 L3 5.5 z"/></marker>
    <marker id="arrow-t3" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto"><path class="head-t3" d="M0 0 L13 5.5 L0 11 L3 5.5 z"/></marker>
    <marker id="arrow-old" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto"><path class="head-old" d="M0 0 L13 5.5 L0 11 L3 5.5 z"/></marker>
  </defs>

